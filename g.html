<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>תמונות הנכס</title>
<style>
  :root{--bg:#0d0f12;--fg:#f1f3f5;--muted:#9aa3ad;--btn:rgba(255,255,255,.12)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,"Segoe UI",Arial,sans-serif;overflow:hidden}
  header{position:fixed;top:0;inset-inline:0;z-index:3;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(rgba(0,0,0,.65),transparent)}
  header .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .b{border:0;background:var(--btn);color:var(--fg);border-radius:999px;padding:7px 12px;font:inherit;cursor:pointer;text-decoration:none;white-space:nowrap}
  #strip{height:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;direction:rtl;overscroll-behavior:contain}
  #strip::-webkit-scrollbar{display:none}
  .s{flex:0 0 100%;height:100%;scroll-snap-align:center;display:grid;place-items:center;padding:56px 0 40px}
  .s img{max-width:100%;max-height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
  .s .err{color:var(--muted)}
  #count{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:3px 12px;border-radius:999px;font-variant-numeric:tabular-nums;z-index:3}
  .nav{position:fixed;top:50%;transform:translateY(-50%);z-index:3;width:44px;height:64px;border:0;border-radius:10px;background:var(--btn);color:var(--fg);font-size:28px;cursor:pointer}
  #prev{right:10px}#next{left:10px}
  @media (hover:none){.nav{display:none}}
  .empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
</style>
</head>
<body>
<header>
  <button class="b" id="back" type="button">→ חזרה</button>
  <div class="t" id="title"></div>
  <a class="b" id="yad2" target="_blank" rel="noopener" hidden>ביד2 ↗</a>
</header>
<div id="strip"></div>
<button class="nav" id="prev" type="button" aria-label="הקודמת">›</button>
<button class="nav" id="next" type="button" aria-label="הבאה">‹</button>
<div id="count"></div>
<script>
// URL: gallery.html#t=<title>&y=<yad2 token>&i=<path1>,<path2>,...  (paths relative to img.yad2.co.il/Pic/, or full https URLs)
const P=new URLSearchParams(location.hash.slice(1));
const BASE='https://img.yad2.co.il/Pic/';
const imgs=(P.get('i')||'').split(',').filter(Boolean).map(x=>/^https?:\/\//.test(x)?x:BASE+x);
const title=P.get('t')||'';const tok=P.get('y')||'';
document.getElementById('title').textContent=title;document.title=title?title+' · תמונות':'תמונות הנכס';
if(tok){const a=document.getElementById('yad2');a.href='https://www.yad2.co.il/realestate/item/'+encodeURIComponent(tok);a.hidden=false;}
const strip=document.getElementById('strip'),count=document.getElementById('count');
if(!imgs.length){strip.innerHTML='<div class="empty">אין תמונות להצגה.</div>';count.hidden=true;}
imgs.forEach((u,i)=>{const d=document.createElement('div');d.className='s';const im=new Image();im.alt=`תמונה ${i+1}`;im.loading=i<2?'eager':'lazy';im.decoding='async';im.referrerPolicy='no-referrer';im.src=u;
  im.onerror=()=>{const e=document.createElement('a');e.className='err';e.href=u;e.target='_blank';e.textContent=`תמונה ${i+1} לא נטענה. לחץ לפתיחה`;im.replaceWith(e);};d.appendChild(im);strip.appendChild(d);});
const cur=()=>Math.round(Math.abs(strip.scrollLeft)/strip.clientWidth);
const upd=()=>{count.textContent=`${Math.min(cur()+1,imgs.length)}/${imgs.length}`;};
strip.addEventListener('scroll',()=>requestAnimationFrame(upd),{passive:true});upd();
const go=n=>{const i=Math.max(0,Math.min(imgs.length-1,cur()+n));strip.scrollTo({left:-i*strip.clientWidth,behavior:'smooth'});};
document.getElementById('next').onclick=()=>go(1);document.getElementById('prev').onclick=()=>go(-1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(1);else if(e.key==='ArrowRight')go(-1);else if(e.key==='Escape')back();});
function back(){if(history.length>1)history.back();else window.close();}
document.getElementById('back').onclick=back;
addEventListener('resize',()=>{const i=cur();strip.scrollLeft=-i*strip.clientWidth;});
</script>
</body>
</html>
